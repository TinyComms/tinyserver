[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/db",
    "crates/server",
    "crates/sfu",
]
# cargo-fuzz targets, built on nightly in their own CI job.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
getrandom = "0.3"
infer = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pinned. Discovery, the code exchange with PKCE, and ID token checks. rustls only: the image
# has no system TLS library and no CA bundle, so reqwest carries the webpki roots.
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate", "json", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
