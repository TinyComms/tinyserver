# Format, lint, and test. The integration tests run against Postgres 17 with the same
# app_owner and app_runtime roles that docker/postgres/init/01-roles.sh makes in production.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinyserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinyserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL_MIGRATE: postgres://app_owner:app_owner@localhost:5432/tinyserver?sslmode=disable
      TEST_DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/tinyserver?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Database roles
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: tinyserver
          APP_OWNER_PASSWORD: app_owner
          APP_RUNTIME_PASSWORD: app_runtime
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          sh docker/postgres/init/01-roles.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # The cargo-fuzz targets in fuzz/, built on nightly and run for a minute each. Apart from
  # check, so a nightly break does not hold up a merge. The nightly is pinned: later ones fail
  # to compile sqlx-core (E0391, a cycle computing async drop for its Error type).
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup toolchain install nightly-2026-10-01 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build
        run: cargo +nightly-2026-10-01 fuzz build

      - name: Run
        run: |
          for target in $(cargo +nightly-2026-10-01 fuzz list); do
            mkdir -p fuzz/corpus/$target
            seeds=fuzz/seeds/$target
            [ -d "$seeds" ] || seeds=
            cargo +nightly-2026-10-01 fuzz run $target fuzz/corpus/$target $seeds -- -max_total_time=60
          done

      - name: Crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
