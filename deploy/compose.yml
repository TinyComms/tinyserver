# One community. Postgres, the server, and Pocket ID share a network that has no route out.
# clamd is on the media network, which has a route out, so freshclam can fetch signatures.
# tinyserver reaches it there at clamd:3310. That port is not published.
# cloudflared carries HTTP and the live socket for the chat hostname, and the sign-in pages for
# the auth hostname; it is the only way in to either. The one thing published on the host is the
# media port, UDP and the same number on TCP, for call audio straight to the SFU.
#
# Sign-in goes through Pocket ID, an OpenID Connect provider that signs people in with passkeys.
# Its issuer is its public auth URL. tinyserver reaches it inside, at http://pocket-id:1411, for
# discovery, keys, the code exchange, and the single-use sign-up links an invite gets, and still
# checks that every token names the public issuer.

name: tinyserver

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # One community, one database and two login roles. The defaults are what a single community
      # has always had; a tenant (deploy/tenant/) sets all four, so no two tenants share a name.
      POSTGRES_DB: ${TINYSERVER_DB_NAME:-tinyserver}
      TINYSERVER_OWNER_ROLE: ${TINYSERVER_OWNER_ROLE:-app_owner}
      TINYSERVER_RUNTIME_ROLE: ${TINYSERVER_RUNTIME_ROLE:-app_runtime}
      TINYSERVER_OWNER_CREATEDB: ${TINYSERVER_OWNER_CREATEDB:-yes}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set APP_OWNER_PASSWORD}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD}
    volumes:
      - ${TINYSERVER_PG_DIR:-tinyserver_pg}:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${TINYSERVER_DB_NAME:-tinyserver}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # The image starts as root to own its data directory, then drops to the postgres user. It
    # needs these five to do that and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # The image writes only its data directory, its socket directory and /tmp.
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m
      - /tmp:size=16m
    pids_limit: ${TINYSERVER_PG_PIDS_LIMIT:-256}
    mem_limit: ${TINYSERVER_PG_MEM_LIMIT:-1g}
    networks:
      - inside
    logging: *logging

  tinyserver:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tinyserver:local
    depends_on:
      postgres:
        condition: service_healthy
      pocket-id:
        condition: service_healthy
      tinyserver-uploads:
        condition: service_completed_successfully
      tinyserver-init:
        condition: service_completed_successfully
      clamd:
        condition: service_healthy
    environment:
      # The serving process holds the runtime role only. The owner role, which can change the
      # schema and bypasses row-level security, lives in tinyserver-init and nowhere else, so
      # a flaw in this process cannot reach it.
      DATABASE_URL: postgres://${TINYSERVER_RUNTIME_ROLE:-app_runtime}:${APP_RUNTIME_PASSWORD}@postgres:5432/${TINYSERVER_DB_NAME:-tinyserver}
      BIND: 0.0.0.0:8080
      # The address people type into tinyclient. The sign-in callback is under it.
      TINYSERVER_PUBLIC_URL: ${TINYSERVER_PUBLIC_URL:?set TINYSERVER_PUBLIC_URL, such as https://chat.example.org}
      # How people sign in: oidc (Pocket ID, as before), both (passkeys beside Pocket ID, for the
      # move), or passkey (see compose.passkey.yml, which also removes Pocket ID). Passkeys are
      # bound to the host of TINYSERVER_PUBLIC_URL: see docs/auth-passkeys.md before changing it.
      TINYSERVER_AUTH: ${TINYSERVER_AUTH:-oidc}
      # Pocket ID, the default provider. The issuer is exactly AUTH_PUBLIC_URL (TINYAUTH_PUBLIC_URL
      # from before the move to Pocket ID still works).
      TINYSERVER_OIDC_ISSUER: ${AUTH_PUBLIC_URL:-${TINYAUTH_PUBLIC_URL:?set AUTH_PUBLIC_URL, such as https://auth.example.org}}
      TINYSERVER_OIDC_INTERNAL_URL: http://pocket-id:1411
      TINYSERVER_OIDC_CLIENT_ID: tinyserver
      TINYSERVER_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      TINYSERVER_OIDC_PROVIDER_NAME: ${TINYSERVER_OIDC_PROVIDER_NAME:-Pocket ID}
      # Someone with an invite and no account makes one at Pocket ID, with a single-use sign-up
      # link tinyserver asks for through the API. Set to none to turn it off.
      TINYSERVER_OIDC_SIGNUP: ${TINYSERVER_OIDC_SIGNUP:-pocket-id}
      TINYSERVER_OIDC_POCKETID_API_KEY_FILE: /run/secrets/pocketid_api_key
      # Pocket ID groups a new account joins, by id. Optional.
      TINYSERVER_OIDC_POCKETID_GROUP_IDS: ${TINYSERVER_OIDC_POCKETID_GROUP_IDS:-}
      # Optional: let groups from the provider join or become admins. Unset is invite only.
      TINYSERVER_OIDC_MEMBER_GROUPS: ${TINYSERVER_OIDC_MEMBER_GROUPS:-}
      TINYSERVER_OIDC_ADMIN_GROUPS: ${TINYSERVER_OIDC_ADMIN_GROUPS:-}
      # Days a sign-in lasts before tinyclient asks for another.
      TINYSERVER_SESSION_MAX_DAYS: ${TINYSERVER_SESSION_MAX_DAYS:-30}
      # Calls have media only when the public address is set. Members see it.
      TINYSERVER_MEDIA_PORT: ${TINYSERVER_MEDIA_PORT:-50000}
      TINYSERVER_PUBLIC_IP: ${TINYSERVER_PUBLIC_IP:-}
      # The host's address on the home network, for members on it. Optional.
      TINYSERVER_LAN_IP: ${TINYSERVER_LAN_IP:-}
      # What media may upload to everyone, in kb/s. Optional; unset is no budget.
      TINYSERVER_MEDIA_EGRESS_KBPS: ${TINYSERVER_MEDIA_EGRESS_KBPS:-}
      # clamd over TCP on the Docker network. Port 3310 is not published on the host.
      # deploy/scan-off.yml turns scanning off, for files sealed before they reach the server.
      TINYSERVER_SCAN_ENGINE: ${TINYSERVER_SCAN_ENGINE:-clamd}
      TINYSERVER_CLAMD_SOCKET: clamd:3310
      TINYSERVER_UPLOAD_DIR: /data/uploads
      # Signed media paths. 32 bytes of hex the operator generates. Required; unset will not start.
      TINYSERVER_MEDIA_HMAC_SECRET: ${TINYSERVER_MEDIA_HMAC_SECRET:?set TINYSERVER_MEDIA_HMAC_SECRET to 64 hex characters (openssl rand -hex 32)}
      # Whose cf-connecting-ip the sign-in limiter believes. Unset trusts private peers, which
      # covers cloudflared here; set it to the tunnel's address to trust only the tunnel.
      TINYSERVER_TRUSTED_PROXIES: ${TINYSERVER_TRUSTED_PROXIES:-}
      # Debug bundles. The image is read-only, so this is a tmpfs. The owner invite is in
      # /bootstrap, written by tinyserver-init.
      TINYSERVER_DATA_DIR: /var/lib/tinyserver
    tmpfs:
      - /var/lib/tinyserver:uid=10001,gid=10001,mode=0700
    secrets:
      - oidc_client_secret
      - pocketid_api_key
    volumes:
      - tinyserver_uploads:/data/uploads
      # The owner invite tinyserver-init writes. Read only here.
      - tinyserver_bootstrap:/bootstrap:ro
    # The same number inside and out: the SFU advertises the port it binds. TCP is ICE-TCP,
    # for networks that block UDP.
    ports:
      - "${TINYSERVER_MEDIA_PORT:-50000}:${TINYSERVER_MEDIA_PORT:-50000}/udp"
      - "${TINYSERVER_MEDIA_PORT:-50000}:${TINYSERVER_MEDIA_PORT:-50000}/tcp"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A community that runs away with memory, processes, or CPU stops at these, not at the
    # host. Raise them for a large community; they are not a promise of how much it needs.
    pids_limit: ${TINYSERVER_PIDS_LIMIT:-512}
    mem_limit: ${TINYSERVER_MEM_LIMIT:-1g}
    cpus: ${TINYSERVER_CPUS:-2}
    networks:
      - inside
      - media
    logging: *logging

  # Migrates the schema and, while there is no owner, writes the owner invite. This is the only
  # place the owner role's password is. It runs to the end before tinyserver starts and again
  # on every `up`, as the same unprivileged user, with no route out, and then it is gone.
  tinyserver-init:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tinyserver:local
    depends_on:
      postgres:
        condition: service_healthy
      tinyserver-uploads:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c", "tinyserver migrate && tinyserver bootstrap"]
    environment:
      DATABASE_URL_MIGRATE: postgres://${TINYSERVER_OWNER_ROLE:-app_owner}:${APP_OWNER_PASSWORD}@postgres:5432/${TINYSERVER_DB_NAME:-tinyserver}
      TINYSERVER_PUBLIC_URL: ${TINYSERVER_PUBLIC_URL:?set TINYSERVER_PUBLIC_URL, such as https://chat.example.org}
      TINYSERVER_DATA_DIR: /bootstrap
      # The default issuer for `relink-identity`, which runs here.
      TINYSERVER_OIDC_ISSUER: ${AUTH_PUBLIC_URL:-${TINYAUTH_PUBLIC_URL:?set AUTH_PUBLIC_URL, such as https://auth.example.org}}
    volumes:
      - tinyserver_bootstrap:/bootstrap
    # The inside network has no route out. It reaches Postgres and nothing else.
    networks:
      - inside
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    logging: *logging

  # Gives the upload and bootstrap volumes to tinyserver's user, 10001, once. The image has no
  # shell to do it.
  tinyserver-uploads:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/data/uploads", "/bootstrap"]
    volumes:
      - tinyserver_uploads:/data/uploads
      - tinyserver_bootstrap:/bootstrap
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *logging

  # Scans uploads. TCP 3310 stays on the media network; it is not published. A clamav-owned
  # socket file would refuse uid 10001, so tinyserver uses host:port instead.
  clamd:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_TCPSocket: "3310"
      CLAMD_CONF_TCPAddr: 0.0.0.0
    volumes:
      - clamav_db:/var/lib/clamav
    restart: unless-stopped
    # ClamAV holds its signature set in memory, about 1.5 GiB loaded. Below this it is killed.
    pids_limit: 128
    mem_limit: ${TINYSERVER_CLAMD_MEM_LIMIT:-3g}
    # The image starts as root to own its directories and drops to the clamav user for clamd and
    # freshclam. It needs these five for that. Its root stays writable: the entrypoint writes the
    # CLAMD_CONF_ settings above into /etc/clamav.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # media, not the internal network: freshclam needs a route out, and tinyserver is already here.
    networks:
      - media
    logging: *logging

  # Gives Pocket ID's data volume to its user, 65532, once. The image has no shell to do it.
  pocket-id-data:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["chown", "65532:65532", "/app/data"]
    volumes:
      - ${POCKETID_DATA_DIR:-pocketid_data}:/app/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *logging

  # The sign-in provider. Passkeys only; accounts come from the first admin's one-time login
  # link and from the single-use sign-up links invites get. One OIDC client, tinyserver, made by
  # deploy/pocket-id/setup.sh. Its database, signing key, and uploads live in the pocketid_data
  # volume. No published port.
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1-distroless@sha256:d035c9c229304cfd25f97a79b2da00bde9cf942abbd70430d452a95420e2836b
    user: "65532:65532"
    depends_on:
      pocket-id-data:
        condition: service_completed_successfully
    environment:
      APP_URL: ${AUTH_PUBLIC_URL:-${TINYAUTH_PUBLIC_URL:?set AUTH_PUBLIC_URL, such as https://auth.example.org}}
      # Only cloudflared may say who the client is.
      TRUST_PROXY: ${TINYSERVER_TUNNEL_IP:-172.30.53.10}
      ENCRYPTION_KEY_FILE: /run/secrets/pocketid_encryption_key
      # An admin key for tinyserver's sign-up links and for setup.sh. Not a user, no login.
      STATIC_API_KEY_FILE: /run/secrets/pocketid_api_key
      # Settings come from here, not the admin pages.
      UI_CONFIG_DISABLED: "true"
      APP_NAME: ${AUTH_APP_NAME:-tinyserver}
      # New accounts only with a sign-up link: an invite's, or one an admin makes.
      ALLOW_USER_SIGNUPS: withToken
      # No mail is sent, so an email is optional and never counts as verified.
      REQUIRE_USER_EMAIL: "false"
      EMAILS_VERIFIED: "false"
      ALLOW_OWN_ACCOUNT_EDIT: "true"
      # setup.sh registers the client secret tinyserver already has; none is made here.
      AUTO_CREATE_OIDC_CLIENT_SECRET: "false"
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      ICON_LIBRARY_URL: disabled
      LOG_JSON: "true"
    secrets:
      - pocketid_encryption_key
      - pocketid_api_key
    volumes:
      - ${POCKETID_DATA_DIR:-pocketid_data}:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      - inside
    logging: *logging

  # Routes the chat hostname to http://tinyserver:8080 and the auth hostname to
  # http://pocket-id:1411. Both public hostnames are set on the tunnel in Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - tinyserver
      - pocket-id
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      inside:
        # Fixed, so Pocket ID can trust its forwarded-for header and nothing else's.
        ipv4_address: ${TINYSERVER_TUNNEL_IP:-172.30.53.10}
      edge: {}
    logging: *logging

secrets:
  # Files next to this compose file, in a directory only root reads. See deploy/README.md.
  oidc_client_secret:
    file: ${TINYSERVER_SECRETS_DIR:-./secrets}/oidc_client_secret
  pocketid_api_key:
    file: ${TINYSERVER_SECRETS_DIR:-./secrets}/pocketid_api_key
  pocketid_encryption_key:
    file: ${TINYSERVER_SECRETS_DIR:-./secrets}/pocketid_encryption_key

networks:
  inside:
    internal: true
    ipam:
      config:
        - subnet: ${TINYSERVER_INSIDE_SUBNET:-172.30.53.0/24}
  edge:
  # Docker publishes ports only from a network that is not internal.
  media:

volumes:
  tinyserver_pg:
  pocketid_data:
  tinyserver_uploads:
  tinyserver_bootstrap:
  clamav_db:
