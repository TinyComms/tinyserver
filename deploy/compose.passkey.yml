# Passkeys only: no Pocket ID. Use it on top of compose.yml, once every member has a passkey
# (docs/auth-passkeys.md, "Moving a community from Pocket ID"):
#
#   docker compose -f compose.yml -f compose.passkey.yml up -d
#
# What it does:
#   * tinyserver signs people in with its own passkeys and contacts no identity provider.
#   * Pocket ID, its data job, and its three secrets are not started or mounted. Its volume is
#     left alone.
#   * The auth hostname is no longer needed. Remove its public hostname from the tunnel in
#     Cloudflare when you are sure you will not go back.
#
# Passkeys belong to the host of TINYSERVER_PUBLIC_URL. Keep it the same.
#
# Needs Docker Compose 2.24.4 or later for `!override` and `!reset`.

services:
  tinyserver:
    # Starts without Pocket ID, and without its secrets. Only the entry for Pocket ID is taken
    # out, so this file and scan-off.yml can be used together.
    depends_on:
      pocket-id: !reset null
    secrets: !override []
    # Only the provider's settings are emptied, and tinyserver reads an empty setting as unset.
    # Everything else compose.yml gives tinyserver stays, and so does anything added there
    # later: the key file path, the database address, the scan engine. Do not put `!override`
    # on this map: it once dropped TINYSERVER_E2EE_KEY_FILE, and a server that had run without
    # this file could not find its key and did not start. crates/server/tests/deploy_compose.rs
    # checks it.
    environment:
      # Shown by the browser when it asks for a passkey.
      TINYSERVER_PASSKEY_RP_NAME: ${TINYSERVER_PASSKEY_RP_NAME:-TinyComms}
      TINYSERVER_OIDC_ISSUER: ""
      TINYSERVER_OIDC_INTERNAL_URL: ""
      TINYSERVER_OIDC_CLIENT_ID: ""
      TINYSERVER_OIDC_CLIENT_SECRET_FILE: ""
      TINYSERVER_OIDC_PROVIDER_NAME: ""
      TINYSERVER_OIDC_SIGNUP: ""
      TINYSERVER_OIDC_POCKETID_API_KEY_FILE: ""
      TINYSERVER_OIDC_POCKETID_GROUP_IDS: ""
      TINYSERVER_OIDC_MEMBER_GROUPS: ""
      TINYSERVER_OIDC_ADMIN_GROUPS: ""

  tunnel:
    depends_on: !override
      - tinyserver

  # Not started. A profile nothing turns on keeps the services in the file without running them.
  pocket-id:
    profiles: ["retired-pocket-id"]
    depends_on: !reset []
  pocket-id-data:
    profiles: ["retired-pocket-id"]
