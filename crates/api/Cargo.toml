[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Entry points for the targets in `fuzz/`. Not for the server.
fuzz = []

[dependencies]
axum = { workspace = true, features = ["ws"] }
db = { path = "../db" }
sfu = { path = "../sfu" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
# The version axum's `ws` feature uses. Only its error type is read, to tell an oversized frame.
tokio-tungstenite = { version = "0.29", default-features = false }
tracing.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
sfu = { path = "../sfu", features = ["headless"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
