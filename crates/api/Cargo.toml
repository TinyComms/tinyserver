[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Entry points for the targets in `fuzz/`. Not for the server.
fuzz = []

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
db = { path = "../db" }
openidconnect.workspace = true
reqwest.workspace = true
sfu = { path = "../sfu" }
serde.workspace = true
serde_json.workspace = true
# The hash of the sign-in pages' stylesheet, for their Content-Security-Policy.
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
# The version axum's `ws` feature uses. Only its error type is read, to tell an oversized frame.
tokio-tungstenite = { version = "0.29", default-features = false }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The fake provider in tests/common/oidc.rs signs ID tokens with openidconnect itself.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
sfu = { path = "../sfu", features = ["headless"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# Catches what sign-in logs, to show no secret is in it.
tracing-subscriber.workspace = true

[lints]
workspace = true
