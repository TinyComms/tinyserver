[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Entry points for the targets in `fuzz/`. Not for the server.
fuzz = []

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
db = { path = "../db" }
openidconnect.workspace = true
# End-to-end encrypted calls: the server is the MLS external sender and delivery service. It
# signs Add and Remove proposals and reads the outer frame of commits; it never holds a group
# secret. The versions tinyclient's `davey` (DAVE) links, so both sides speak the same MLS.
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
reqwest.workspace = true
sfu = { path = "../sfu" }
serde.workspace = true
serde_json.workspace = true
# The hash of the sign-in pages' stylesheet, for their Content-Security-Policy.
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio.workspace = true
# The version axum's `ws` feature uses. Only its error type is read, to tell an oversized frame.
tokio-tungstenite = { version = "0.29", default-features = false }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Discord's DAVE, as tinyclient runs it: the e2ee tests drive real clients through the server.
davey = "=0.1.5"
# The fake provider in tests/common/oidc.rs signs ID tokens with openidconnect itself.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
sfu = { path = "../sfu", features = ["headless"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# Catches what sign-in logs, to show no secret is in it.
tracing-subscriber.workspace = true

[lints]
workspace = true
